name: Nightly Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Nightly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate nightly version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '(?<=<revision>)[^<]+' pom.xml | head -1)
          echo "version=${BASE_VERSION}-nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B -ntp clean package -Drevision=${{ steps.version.outputs.version }} -DskipTests

      - name: Locate built JAR
        id: jar
        run: |
          JAR=$(ls target/*.jar | grep -v 'original-' | grep -v 'sources' | grep -v 'javadoc' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "::error::No JAR found in target/"
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish nightly to GitHub & Modrinth (beta)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}
          github-generate-changelog: false
          github-prerelease: true

          modrinth-id: rexvaults
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false

          name: "RexVaults Nightly #${{ github.run_number }}"
          version: ${{ steps.version.outputs.version }}
          version-type: beta
          files: ${{ steps.jar.outputs.path }}
          changelog: |
            Automated nightly build. It may be unstable.

            Commit ${{ github.sha }}

            ${{ github.event.head_commit.message }}

          loaders: |
            paper
            purpur
            folia
            bukkit
            spigot
          game-versions: |
            >=1.21
          game-version-filter: releases
          java: |
            21
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail
